services:

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    expose:
      - "8082"
      - "50052"

    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: auth_db

    depends_on:
      postgres_db:
        condition: service_healthy

    networks:
      - app-network


  design-service:
    build:
      context: .
      dockerfile: design-service/Dockerfile

    expose:
      - "50051"

    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: design_db

    depends_on:
      postgres_db:
        condition: service_healthy

    networks:
      - app-network


  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile

    expose:
      - "8082"
      - "50053"

    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: user_db

    depends_on:
      postgres_db:
        condition: service_healthy

    networks:
      - app-network
  gateway:
    build:
      context: ./gateway

    ports:
      - "8080:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - auth-service
      - design-service
      - user-service

    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge