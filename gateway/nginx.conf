upstream auth_service_http {
    server auth-service:8082;
}

upstream auth_service_grpc {
    server auth-service:50052;
}

upstream design_service_grpc {
    server design-service:50051;
}

upstream user_service_http {
    server user-service:8082;
}

upstream user_service_grpc {
    server user-service:50053;
}

server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /auth {
        proxy_pass http://auth_service_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://auth_service_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
    }

    location /api/users/ {
        proxy_pass http://design-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
    }

    location /api/profile {
        proxy_pass http://user_service_http;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
    }
    location /auth.AuthService/ {
        grpc_pass grpc://auth_service_grpc;
    }

    location /design.DesignService/ {
        grpc_pass grpc://design_service_grpc;
    }

    location /user.UserService/ {
        grpc_pass grpc://user_service_grpc;
    }

    location /dashboard {
        root /usr/share/nginx/html;
        try_files /dashboard.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index dashboard.html;
        try_files $uri $uri/ =404;
    }
}